provider: akshare
interface: fund_etf_hist_em
period: daily
adjust: qfq
start_date: "20100101"
end_date: "20260731"
output: data/real/etf_daily.csv
manifest: data/real/manifest.json
universe_scope: fixed_research_universe
historical_universe_complete: false
survivorship_bias_controlled: false

# A survivorship-controlled research run must pass both files explicitly to
# scripts/fetch_real_data.py.  The repository does not bundle licensed market
# catalogues or raw prices.
historical_catalog:
  required_scope: all_sh_sz_etfs
  required_columns:
    - symbol
    - name
    - listing_date
    - delisting_date
    - source
  metadata_required:
    - source_name
    - provider_id
    - source_url
    - authoritative
    - scope
    - complete_through
    - expected_symbol_count

benchmark:
  symbol: sh000300
  name: 沪深300指数
  provider: akshare
  interface: stock_zh_index_daily
  output: data/real/benchmark_000300.csv

universe:
  - symbol: "510300"
    name: 沪深300ETF
    category: china_large_cap
  - symbol: "510500"
    name: 中证500ETF
    category: china_mid_cap
  - symbol: "588000"
    name: 科创50ETF
    category: china_star_50
  - symbol: "510880"
    name: 红利ETF
    category: china_dividend
  - symbol: "518880"
    name: 黄金ETF
    category: gold
  - symbol: "511010"
    name: 国债ETF
    category: china_government_bond
